# Copy this file to application-secrets.properties (same folder) and fill in real values.
# application-secrets.properties is git-ignored; this example file is safe to commit.

spring.datasource.password=YOUR_MYSQL_PASSWORD

# At least 64 random characters
spring.app.jwtSecret=CHANGE_ME_TO_A_LONG_RANDOM_STRING_OF_AT_LEAST_64_CHARACTERS_xxxxxxxxxxxxxxxx

# Razorpay Dashboard > Settings > API Keys (use Test Mode keys while developing)
razorpay.key.id=rzp_test_xxxxxxxxxxxxxx
razorpay.key.secret=xxxxxxxxxxxxxxxxxxxxxxxx
# Razorpay Dashboard > Webhooks: URL https://<your-backend>/api/payments/webhook,
# events payment.captured + payment.failed, and the secret you choose there. Empty = disabled.
razorpay.webhook.secret=

# Gmail address + App Password. Leave empty to print OTP codes in the console (development only).
spring.mail.username=
spring.mail.password=

app.admin.email=admin@example.com
app.admin.password=ChangeMe@123
# Secret code for admin sign-up (Register -> Admin). Use a long random value; empty = admin sign-up off.
app.admin.registration-code=

# Password for every demo account (demo.customer@, demo.seller@, demo.rider@shopsphere.local and the demo stores)
app.demo.password=ChangeMe@123
# List the admin login as a demo button on the sign-in page (local development only)
app.demo.show-admin-login=false
