spring.application.name=ecommerce

# =============================================================
# Secrets (DB password, JWT secret, Razorpay keys, Gmail app password, admin login)
# live in application-secrets.properties, which is git-ignored.
# Copy application-secrets.example.properties to application-secrets.properties and fill it in.
# On a server, set them as environment variables instead (e.g. RAZORPAY_KEY_SECRET,
# SPRING_DATASOURCE_PASSWORD) - Spring maps those to the same property names automatically.
# =============================================================
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_intern?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate related setting
# =============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===================================

#User defined propertities;
# spring.app.jwtSecret is in application-secrets.properties
# Token lifetime: 1 day
spring.app.jwtExpirationMs=86400000

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# razorpay.key.id and razorpay.key.secret are in application-secrets.properties


# Email Configuration (username/password are in application-secrets.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=ShopSphere

# ===================================
# ShopSphere application settings
# ===================================
# Comma-separated list of frontend origins allowed by CORS
app.frontend.urls=http://localhost:5173,http://127.0.0.1:5173
# Used for links inside emails
app.frontend.public-url=http://localhost:5173

app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# Adds demo categories/products on first start when the catalog is empty. Use false in production.
app.seed.demo-data=true




